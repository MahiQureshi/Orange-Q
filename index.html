<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ORANGE-Q AI — AI-assisted quality assessment for orange planting material."
    >

    <meta
        name="theme-color"
        content="#102A43"
    >

    <title>ORANGE-Q AI</title>

    <style>
        :root {
            --bg: #f7fbfd;
            --card: rgba(255, 255, 255, 0.82);
            --border: rgba(16, 42, 67, 0.10);
            --navy: #102A43;
            --blue: #4AA9DF;
            --green: #2E9B68;
            --muted: #61758A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: var(--navy);
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(74, 169, 223, 0.16),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(46, 155, 104, 0.13),
                    transparent 30%
                ),
                var(--bg);
        }

        .entry-screen {
            width: min(92%, 480px);
            padding: 42px 32px;
            text-align: center;
        }

        .logo-mark {
            width: 76px;
            height: 76px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(74, 169, 223, 0.22);
            border-radius: 24px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.95),
                    rgba(234, 246, 255, 0.78)
                );
            box-shadow:
                0 18px 45px rgba(16, 42, 67, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            animation: floatLogo 2.8s ease-in-out infinite;
        }

        .logo-leaf {
            position: relative;
            width: 38px;
            height: 48px;
            border-radius: 70% 30% 70% 30%;
            transform: rotate(-38deg);
            background: linear-gradient(
                145deg,
                #55B879,
                #2E9B68
            );
        }

        .logo-leaf::after {
            content: "";
            position: absolute;
            left: 18px;
            top: 5px;
            width: 2px;
            height: 39px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.72);
            transform: rotate(24deg);
        }

        .brand {
            margin-bottom: 8px;
            font-size: clamp(1.75rem, 6vw, 2.35rem);
            font-weight: 800;
            letter-spacing: -0.045em;
        }

        .brand span {
            color: var(--green);
        }

        .tagline {
            max-width: 390px;
            margin: 0 auto;
            color: var(--muted);
            font-size: 0.96rem;
            line-height: 1.6;
        }

        .loading-area {
            margin-top: 30px;
        }

        .loading-track {
            width: 100%;
            height: 5px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(16, 42, 67, 0.08);
        }

        .loading-bar {
            width: 35%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(
                90deg,
                var(--blue),
                var(--green)
            );
            animation: loading 1.25s ease-in-out infinite;
        }

        .loading-text {
            margin-top: 12px;
            color: #718398;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .status {
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 13px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.58);
            color: #52687D;
            font-size: 0.74rem;
            font-weight: 600;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 4px rgba(46, 155, 104, 0.10);
        }

        @keyframes loading {
            0% {
                transform: translateX(-120%);
            }

            50% {
                transform: translateX(150%);
            }

            100% {
                transform: translateX(300%);
            }
        }

        @keyframes floatLogo {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo-mark,
            .loading-bar {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <main
        class="entry-screen"
        aria-label="ORANGE-Q AI"
    >

        <div
            class="logo-mark"
            aria-hidden="true"
        >
            <div class="logo-leaf"></div>
        </div>

        <h1 class="brand">
            ORANGE-Q <span>AI</span>
        </h1>

        <p class="tagline">
            AI-assisted quality assessment for
            standardized screening of orange planting material.
        </p>

        <div class="loading-area">

            <div
                class="loading-track"
                role="progressbar"
                aria-label="Loading ORANGE-Q AI"
            >
                <div class="loading-bar"></div>
            </div>

            <p class="loading-text">
                Initializing assessment platform...
            </p>

        </div>

        <div class="status">
            <span class="status-dot"></span>
            Prototype environment
        </div>

    </main>

    <script>
        /*
         * ORANGE-Q AI
         * Entry Router
         *
         * IMPORTANT:
         * The key "orq_current_user" is the permanent
         * session key for this prototype.
         *
         * login.html and signup.html will use the
         * exact same key.
         */

        (function () {
            const CURRENT_USER_KEY = "orq_current_user";

            let currentUser = null;

            try {
                const storedUser =
                    localStorage.getItem(CURRENT_USER_KEY);

                if (storedUser) {
                    currentUser = JSON.parse(storedUser);
                }
            } catch (error) {
                console.warn(
                    "ORANGE-Q AI: Unable to read saved session.",
                    error
                );

                localStorage.removeItem(CURRENT_USER_KEY);
            }

            /*
             * A very short delay gives the entry screen
             * time to render before navigation.
             */
            setTimeout(function () {

                if (
                    currentUser &&
                    typeof currentUser === "object" &&
                    currentUser.name
                ) {
                    window.location.replace("dashboard.html");
                } else {
                    window.location.replace("login.html");
                }

            }, 850);
        })();
    </script>

</body>
</html>
